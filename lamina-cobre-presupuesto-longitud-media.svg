<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Presupuestar cobre: el error suele estar en la longitud de la espira</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / REBOBINADO / ESQUEMA CONCEPTUAL</text><rect x="90" y="110" width="390" height="170" rx="8" fill="#fff" stroke="#244de0"/><rect x="150" y="110" width="270" height="170" rx="8" fill="#edf1ff" stroke="#244de0"/><path d="M150 130L420 130" fill="none" stroke="#e26736" stroke-width="9"/><path d="M150 260L420 260" fill="none" stroke="#e26736" stroke-width="9"/><path d="M105 130L105 260" fill="none" stroke="#e26736" stroke-width="9"/><path d="M465 130L465 260" fill="none" stroke="#e26736" stroke-width="9"/><path d="M105 130L150 130" fill="none" stroke="#e26736" stroke-width="9"/><path d="M105 260L150 260" fill="none" stroke="#e26736" stroke-width="9"/><path d="M420 130L465 130" fill="none" stroke="#e26736" stroke-width="9"/><path d="M420 260L465 260" fill="none" stroke="#e26736" stroke-width="9"/><text x="180" y="200" text-anchor="start" font-family="sans-serif" font-size="21" fill="#17253d">Lados activos</text><text x="520" y="150" text-anchor="start" font-family="sans-serif" font-size="24" fill="#e26736">+ cabezas</text><text x="520" y="195" text-anchor="start" font-family="sans-serif" font-size="23" fill="#17253d">= espira completa</text><text x="60" y="340" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">Masa = espiras × bobinas × longitud media × hilos × sección × densidad</text><text x="60" y="377" text-anchor="start" font-family="sans-serif" font-size="14" fill="#586577">Recorrido esquemático; no representa la forma de una bobina real.</text></svg>