<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Hilos en paralelo: por qué no se suman los diámetros</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / COBRE / ESQUEMA CONCEPTUAL</text><text x="45" y="88" text-anchor="start" font-family="sans-serif" font-size="24" fill="#17253d">Igual sección total ≠ igual diámetro</text><circle cx="130" cy="205" r="45" fill="#ffe0ce" stroke="#e26736" stroke-width="3"/><text x="130" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17253d">0,80 mm</text><circle cx="245" cy="205" r="45" fill="#ffe0ce" stroke="#e26736" stroke-width="3"/><text x="245" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#17253d">0,80 mm</text><text x="335" y="220" text-anchor="start" font-family="sans-serif" font-size="45" fill="#244de0">=</text><circle cx="490" cy="205" r="36.74" fill="#ffe0ce" stroke="#e26736" stroke-width="3"/><text x="490" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17253d">0,6532 mm</text><circle cx="590" cy="205" r="36.74" fill="#ffe0ce" stroke="#e26736" stroke-width="3"/><text x="590" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17253d">0,6532 mm</text><circle cx="690" cy="205" r="36.74" fill="#ffe0ce" stroke="#e26736" stroke-width="3"/><text x="690" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17253d">0,6532 mm</text><text x="45" y="342" text-anchor="start" font-family="sans-serif" font-size="23" fill="#17253d">2 × π·0,80²/4 = 3 × π·0,6532²/4 ≈ 1,0053 mm²</text><text x="45" y="377" text-anchor="start" font-family="sans-serif" font-size="14" fill="#586577">Diámetro de cobre desnudo. El esmalte y los huecos ocupan espacio adicional.</text></svg>