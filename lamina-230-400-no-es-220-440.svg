<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">230/400 V no significa lo mismo que 220/440 V</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / CONEXIONES / ESQUEMA CONCEPTUAL</text><text x="40" y="95" text-anchor="start" font-family="sans-serif" font-size="25" fill="#17253d">Relación √3</text><text x="490" y="95" text-anchor="start" font-family="sans-serif" font-size="25" fill="#17253d">Relación 2</text><rect x="40" y="125" width="310" height="145" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="65" y="170" text-anchor="start" font-family="sans-serif" font-size="22" fill="#244de0">230 V × √3 ≈ 400 V</text><text x="65" y="210" text-anchor="start" font-family="sans-serif" font-size="29" fill="#17253d">Δ / Y</text><text x="65" y="246" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17253d">Misma tensión por fase</text><rect x="490" y="125" width="360" height="145" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="515" y="170" text-anchor="start" font-family="sans-serif" font-size="22" fill="#244de0">220 V × 2 = 440 V</text><text x="515" y="210" text-anchor="start" font-family="sans-serif" font-size="29" fill="#17253d">Paralelo / Serie</text><text x="515" y="246" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17253d">Secciones por fase</text><text x="40" y="322" text-anchor="start" font-family="sans-serif" font-size="21" fill="#17253d">La placa y el esquema determinan la conexión.</text><text x="40" y="355" text-anchor="start" font-family="sans-serif" font-size="15" fill="#586577">No representa un diagrama de puentes.</text></svg>