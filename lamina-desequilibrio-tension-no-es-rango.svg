<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Desequilibrio trifásico: la diferencia máxima no es el rango</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / MEDICIÓN / ESQUEMA CONCEPTUAL</text><text x="40" y="85" text-anchor="start" font-family="sans-serif" font-size="25" fill="#17253d">Promedio: 400 V</text><text x="45" y="147" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">AB</text><path d="M130 140L750 140" fill="none" stroke="#c8d2ff" stroke-width="3"/><circle cx="440" cy="140" r="8" fill="#e26736" stroke="#e26736" stroke-width="3"/><text x="770" y="147" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">400 V</text><text x="45" y="210" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">BC</text><path d="M130 203L750 203" fill="none" stroke="#c8d2ff" stroke-width="3"/><circle cx="590" cy="203" r="8" fill="#e26736" stroke="#e26736" stroke-width="3"/><text x="770" y="210" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">405 V</text><text x="45" y="273" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">CA</text><path d="M130 266L750 266" fill="none" stroke="#c8d2ff" stroke-width="3"/><circle cx="290" cy="266" r="8" fill="#e26736" stroke="#e26736" stroke-width="3"/><text x="770" y="273" text-anchor="start" font-family="sans-serif" font-size="18" fill="#17253d">395 V</text><path d="M440 110L440 310" fill="none" stroke="#244de0" stroke-width="2"/><text x="40" y="350" text-anchor="start" font-family="sans-serif" font-size="25" fill="#17253d">Máxima desviación: 5 V → 1,25 %</text><text x="40" y="380" text-anchor="start" font-family="sans-serif" font-size="14" fill="#586577">Eje ampliado: 390–410 V. No usar el rango máximo-mínimo.</text></svg>