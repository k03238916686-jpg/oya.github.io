<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">¿Por qué la placa dice 1740 r/min y no 1800?</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / DIAGNÓSTICO / ESQUEMA CONCEPTUAL</text><text x="45" y="90" text-anchor="start" font-family="sans-serif" font-size="24" fill="#17253d">60 Hz · 4 polos</text><rect x="85" y="145" width="650" height="50" rx="3" fill="#244de0"/><rect x="85" y="230" width="628.33" height="50" rx="3" fill="#e26736"/><text x="100" y="178" text-anchor="start" font-family="sans-serif" font-size="23" fill="white">1800 r/min · campo síncrono</text><text x="100" y="263" text-anchor="start" font-family="sans-serif" font-size="23" fill="white">1740 r/min · eje a carga nominal</text><text x="85" y="335" text-anchor="start" font-family="sans-serif" font-size="24" fill="#17253d">Diferencia: 60 r/min → deslizamiento: 3,33 %</text></svg>