<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Comparar resistencias de bobinado sin corregir temperatura engaña</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / MEDICIÓN / ESQUEMA CONCEPTUAL</text><text x="45" y="85" text-anchor="start" font-family="sans-serif" font-size="24" fill="#17253d">El mismo devanado de cobre</text><path d="M105 290L790 290" fill="none" stroke="#586577" stroke-width="2"/><path d="M105 290L105 115" fill="none" stroke="#586577" stroke-width="2"/><path d="M180 255L680 160" fill="none" stroke="#244de0" stroke-width="4"/><circle cx="180" cy="255" r="7" fill="#244de0" stroke="#244de0" stroke-width="3"/><circle cx="680" cy="160" r="7" fill="#244de0" stroke="#244de0" stroke-width="3"/><text x="140" y="325" text-anchor="start" font-family="sans-serif" font-size="19" fill="#17253d">20 °C</text><text x="640" y="325" text-anchor="start" font-family="sans-serif" font-size="19" fill="#17253d">75 °C</text><text x="150" y="230" text-anchor="start" font-family="sans-serif" font-size="22" fill="#17253d">2,00 Ω</text><text x="625" y="135" text-anchor="start" font-family="sans-serif" font-size="22" fill="#17253d">2,4322 Ω</text><text x="160" y="375" text-anchor="start" font-family="sans-serif" font-size="18" fill="#586577">Mayor resistencia no implica por sí sola pérdida de cobre.</text></svg>