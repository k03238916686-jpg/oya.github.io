<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Un aislamiento alto a masa no descarta un corto entre espiras</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / DIAGNÓSTICO / ESQUEMA CONCEPTUAL</text><rect x="75" y="100" width="370" height="210" rx="8" fill="#fff" stroke="#17253d"/><text x="95" y="135" text-anchor="start" font-family="sans-serif" font-size="20" fill="#17253d">Bastidor / masa</text><path d="M145 185L370 185" fill="none" stroke="#e26736" stroke-width="10"/><path d="M145 215L370 215" fill="none" stroke="#e26736" stroke-width="10"/><path d="M145 245L370 245" fill="none" stroke="#e26736" stroke-width="10"/><path d="M260 185L260 215" fill="none" stroke="#e26736" stroke-width="5"/><text x="490" y="185" text-anchor="start" font-family="sans-serif" font-size="24" fill="#e26736">Entre espiras</text><path d="M380 200L470 177" fill="none" stroke="#e26736" stroke-width="2"/><path d="M370 245L430 285" fill="none" stroke="#244de0" stroke-width="2"/><path d="M430 285L500 285" fill="none" stroke="#244de0" stroke-width="2"/><text x="520" y="293" text-anchor="start" font-family="sans-serif" font-size="24" fill="#244de0">A masa</text><text x="75" y="355" text-anchor="start" font-family="sans-serif" font-size="23" fill="#17253d">Trayectos diferentes → preguntas y ensayos diferentes.</text><text x="75" y="382" text-anchor="start" font-family="sans-serif" font-size="14" fill="#586577">Esquema conceptual: no representa una conexión de prueba.</text></svg>