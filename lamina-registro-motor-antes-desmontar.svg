<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">La ficha de recepción que evita rebobinar a ciegas</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / REBOBINADO / ESQUEMA CONCEPTUAL</text><rect x="35" y="135" width="190" height="130" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="50" y="178" text-anchor="start" font-family="sans-serif" font-size="18" fill="#244de0">Identificación</text><text x="50" y="220" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17253d">placa y esquema</text><text x="232" y="210" text-anchor="start" font-family="sans-serif" font-size="25" fill="#e26736">→</text><rect x="252" y="135" width="190" height="130" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="267" y="178" text-anchor="start" font-family="sans-serif" font-size="18" fill="#244de0">Estado recibido</text><text x="267" y="220" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17253d">fotos y síntomas</text><text x="449" y="210" text-anchor="start" font-family="sans-serif" font-size="25" fill="#e26736">→</text><rect x="469" y="135" width="190" height="130" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="484" y="178" text-anchor="start" font-family="sans-serif" font-size="18" fill="#244de0">Datos medidos</text><text x="484" y="220" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17253d">método y unidades</text><text x="666" y="210" text-anchor="start" font-family="sans-serif" font-size="25" fill="#e26736">→</text><rect x="686" y="135" width="190" height="130" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="701" y="178" text-anchor="start" font-family="sans-serif" font-size="18" fill="#244de0">Decisión</text><text x="701" y="220" text-anchor="start" font-family="sans-serif" font-size="14" fill="#17253d">suficiente / pendiente</text><text x="45" y="340" text-anchor="start" font-family="sans-serif" font-size="22" fill="#17253d">Separar «encontrado» de «verificado» conserva la trazabilidad.</text><text x="45" y="377" text-anchor="start" font-family="sans-serif" font-size="16" fill="#586577">Un dato desconocido no se completa con una suposición.</text></svg>