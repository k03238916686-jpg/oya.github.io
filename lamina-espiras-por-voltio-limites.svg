<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Cambiar espiras con una regla de tres: cuándo sirve y cuándo no</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / REBOBINADO / ESQUEMA CONCEPTUAL</text><text x="45" y="90" text-anchor="start" font-family="sans-serif" font-size="24" fill="#17253d">Qué mantiene la adaptación teórica</text><rect x="45" y="130" width="250" height="110" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="65" y="172" text-anchor="start" font-family="sans-serif" font-size="25" fill="#244de0">Núcleo</text><text x="65" y="210" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">misma geometría</text><rect x="325" y="130" width="250" height="110" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="345" y="172" text-anchor="start" font-family="sans-serif" font-size="25" fill="#244de0">Conexión</text><text x="345" y="210" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">sin cambiar Δ / Y</text><rect x="605" y="130" width="250" height="110" rx="8" fill="#fff" stroke="#c8d2ff"/><text x="625" y="172" text-anchor="start" font-family="sans-serif" font-size="25" fill="#244de0">Flujo</text><text x="625" y="210" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">mismo objetivo</text><text x="45" y="305" text-anchor="start" font-family="sans-serif" font-size="30" fill="#17253d">N₂ / N₁ = (V₂ / V₁) × (f₁ / f₂)</text><text x="45" y="360" text-anchor="start" font-family="sans-serif" font-size="16" fill="#586577">También se conservan polos, factor de bobinado y ramas paralelas.</text></svg>