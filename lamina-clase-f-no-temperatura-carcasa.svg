<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Clase F no significa que la carcasa pueda trabajar a 155 °C</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / DIAGNÓSTICO / ESQUEMA CONCEPTUAL</text><text x="40" y="85" text-anchor="start" font-family="sans-serif" font-size="25" fill="#17253d">Clases térmicas tradicionales</text><rect x="95" y="195" width="95" height="105" rx="3" fill="#244de0"/><text x="142" y="330" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#17253d">A</text><text x="142" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17253d">105 °C</text><rect x="290" y="170" width="95" height="130" rx="3" fill="#244de0"/><text x="337" y="330" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#17253d">B</text><text x="337" y="150" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17253d">130 °C</text><rect x="485" y="145" width="95" height="155" rx="3" fill="#e26736"/><text x="532" y="330" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#17253d">F</text><text x="532" y="125" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17253d">155 °C</text><rect x="680" y="120" width="95" height="180" rx="3" fill="#244de0"/><text x="727" y="330" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#17253d">H</text><text x="727" y="100" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#17253d">180 °C</text><text x="40" y="377" text-anchor="start" font-family="sans-serif" font-size="19" fill="#586577">No son límites de temperatura de contacto de la carcasa.</text></svg>