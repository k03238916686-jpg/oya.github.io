<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t"><title id="t">Un motor de 50 Hz en una red de 60 Hz: tres comprobaciones</title><rect width="900" height="400" rx="12" fill="#edf1ff"/><text x="30" y="36" text-anchor="start" font-family="sans-serif" font-size="13" fill="#244de0">OYA / FRECUENCIA / ESQUEMA CONCEPTUAL</text><text x="40" y="85" text-anchor="start" font-family="sans-serif" font-size="23" fill="#17253d">De 50 a 60 Hz: misma cantidad de polos</text><rect x="55" y="200" width="65" height="100" rx="3" fill="#244de0"/><rect x="140" y="180" width="65" height="120" rx="3" fill="#e26736"/><text x="55" y="335" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17253d">Frecuencia</text><text x="55" y="80" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">50 → 60</text><rect x="340" y="200" width="65" height="100" rx="3" fill="#244de0"/><rect x="425" y="180" width="65" height="120" rx="3" fill="#e26736"/><text x="340" y="335" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17253d">Velocidad síncrona</text><text x="340" y="80" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">1500 → 1800</text><rect x="625" y="200" width="65" height="100" rx="3" fill="#244de0"/><rect x="710" y="127.19999999999999" width="65" height="172.8" rx="3" fill="#e26736"/><text x="625" y="335" text-anchor="start" font-family="sans-serif" font-size="16" fill="#17253d">Potencia de ventilador*</text><text x="625" y="80" text-anchor="start" font-family="sans-serif" font-size="17" fill="#17253d">100 → 172,8</text><text x="40" y="377" text-anchor="start" font-family="sans-serif" font-size="14" fill="#586577">Azul: 50 Hz · Naranja: 60 Hz · *Modelo idealizado, condiciones semejantes.</text></svg>